      <h1>Microsoft Defender Attack Surface Reduction (ASR) Rules Configurator</h1>
      <p>ASR Configurator is an open-source visual tool for generating PowerShell, Microsoft Intune, and Group Policy configurations for all 19 Microsoft Defender Attack Surface Reduction rules.</p>
      <h2>Action Values &amp; Monitoring</h2>
      <ul>
        <li><strong>0 = Disabled:</strong> Rule inactive.</li>
        <li><strong>1 = Block:</strong> Prevents action. Generates Event ID 1121 in Microsoft-Windows-Windows Defender/Operational.</li>
        <li><strong>2 = Audit:</strong> Monitors action without blocking. Generates Event ID 1122 for testing impact.</li>
      </ul>
      <h2>19 Official ASR Rules</h2>
